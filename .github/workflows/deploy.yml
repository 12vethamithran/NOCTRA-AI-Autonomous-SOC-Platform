name: Deploy — Backend to Render

on:
  workflow_run:
    workflows: ["CI — Build Check"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy backend to Render
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -X POST \
            -o /dev/null \
            -w "HTTP %{http_code}\n"

      - name: Wait and verify backend health
        run: |
          echo "Waiting for Render to spin up..."
          sleep 45
          for i in {1..6}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              https://noctra-ai-autonomous-soc-platform.onrender.com/health)
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is live and healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not respond healthy after deploy."
          exit 1
