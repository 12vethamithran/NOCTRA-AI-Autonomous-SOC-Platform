name: Deploy — Backend to Render

on:
  workflow_run:
    workflows: ["CI — Build Check"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy backend to Render
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -X POST \
            -o /dev/null \
            -w "HTTP %{http_code}\n"

      - name: Wait and verify backend health
        # `bash {0}` (not the default `bash -e {0}`) so a curl timeout does not
        # abort the step before the retry loop gets a second chance.
        shell: bash {0}
        run: |
          echo "Waiting for Render to spin up..."
          sleep 45
          for i in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \n              https://noctra-ai-autonomous-soc-platform.onrender.com/health || true)
            code=${code:-000}
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is live and healthy."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Backend did not respond healthy after deploy (last code: $code)"
          exit 1
