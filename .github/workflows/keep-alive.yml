name: Keep Backend Alive

# Pings the Render backend every 10 minutes so it never idles out
# (Render free tier spins a service down after 15 minutes of inactivity).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              https://noctra-ai-autonomous-soc-platform.onrender.com/health)
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "Backend did not return 200 after 3 attempts"
          exit 1
