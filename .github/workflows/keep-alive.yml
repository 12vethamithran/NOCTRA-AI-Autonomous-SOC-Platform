name: Keep Backend Alive

# Pings the Render backend on a schedule so it never idles out
# (Render free tier spins a service down after 15 minutes of inactivity).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /health
        # NOTE: no `set -e` semantics here — curl must be allowed to fail so the
        # retry loop can run. A cold Render free-tier instance often needs
        # 60-120s to boot, which is a normal timeout, not a broken backend.
        # `bash {0}` (not the default `bash -e {0}`) so a curl timeout does not
        # abort the step before the retry loop gets a second chance.
        shell: bash {0}
        env:
          HEALTH_URL: https://noctra-ai-autonomous-soc-platform.onrender.com/health
        run: |
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$HEALTH_URL" || true)
            code=${code:-000}
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            if [ "$i" -lt 5 ]; then sleep 30; fi
          done
          echo "::error::Backend did not return 200 after 5 attempts (last code: $code)"
          exit 1
