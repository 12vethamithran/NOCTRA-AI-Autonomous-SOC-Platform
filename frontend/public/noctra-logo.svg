<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nx" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset=".55" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="ng" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e11d48" stop-opacity=".30"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hex sigil: autonomous monitoring -->
  <path d="M32 3 L57 17 V47 L32 61 L7 47 V17 Z"
        fill="url(#ng)" stroke="url(#nx)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 11 L50 21 V43 L32 53 L14 43 V21 Z"
        fill="none" stroke="#e11d48" stroke-opacity=".30" stroke-width="1"/>

  <!-- Radar arcs: nocturnal sweep -->
  <path d="M14 32 a18 18 0 0 1 36 0" stroke="#fb7185" stroke-opacity=".35" stroke-width="1" fill="none"/>
  <path d="M19 32 a13 13 0 0 1 26 0" stroke="#fb7185" stroke-opacity=".18" stroke-width="1" fill="none"/>

  <!-- Stylized N — also reads as owl wings -->
  <path d="M21 44 V22 L43 44 V22"
        stroke="url(#nx)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Owl eyes / radar pulse anchors -->
  <circle cx="21" cy="22" r="2.6" fill="#fb7185"/>
  <circle cx="43" cy="22" r="2.6" fill="#fb7185"/>
  <circle cx="21" cy="22" r="1.1" fill="#0c0c0e"/>
  <circle cx="43" cy="22" r="1.1" fill="#0c0c0e"/>

  <!-- Center signal -->
  <circle cx="32" cy="33" r="1.6" fill="#fff" fill-opacity=".95"/>
</svg>
