<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nstroke" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#ff4d6d"/>
      <stop offset=".55" stop-color="#e11d48"/>
      <stop offset="1"   stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="nfill" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#1a0408"/>
      <stop offset="1"   stop-color="#08020a"/>
    </linearGradient>
    <radialGradient id="ncore" cx="32" cy="32" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#e11d48" stop-opacity=".35"/>
      <stop offset=".6"   stop-color="#e11d48" stop-opacity=".06"/>
      <stop offset="1"    stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rotated diamond frame -->
  <g transform="rotate(45 32 32)">
    <rect x="9" y="9" width="46" height="46" rx="6"
          fill="url(#nfill)"
          stroke="url(#nstroke)" stroke-width="2"/>
    <rect x="13" y="13" width="38" height="38" rx="3"
          fill="none" stroke="#e11d48" stroke-opacity=".22" stroke-width="0.6"/>
  </g>

  <!-- Inner crimson aura -->
  <circle cx="32" cy="32" r="22" fill="url(#ncore)"/>

  <!-- Sharp angular monogram "N" — two thick verticals + diagonal -->
  <g filter="url(#glow)" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Left vertical -->
    <path d="M22 19 V45"
          stroke="url(#nstroke)" stroke-width="5"/>
    <!-- Right vertical -->
    <path d="M42 19 V45"
          stroke="url(#nstroke)" stroke-width="5"/>
    <!-- Diagonal slash -->
    <path d="M22 19 L42 45"
          stroke="#ff4d6d" stroke-width="4.5"/>
  </g>

  <!-- Targeting tick top-right -->
  <g stroke="#ff4d6d" stroke-width="1.2" opacity=".85">
    <line x1="46" y1="14" x2="50" y2="14"/>
    <line x1="48" y1="12" x2="48" y2="16"/>
  </g>
  <circle cx="48" cy="14" r="1.1" fill="#ff4d6d"/>

  <!-- Lower-left scan dot -->
  <circle cx="16" cy="50" r="1.4" fill="#fff" fill-opacity=".9"/>
</svg>
